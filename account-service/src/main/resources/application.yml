server:
  port: 8082

spring:
  application:
    name: ACCOUNT-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/bank_accountdb?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
